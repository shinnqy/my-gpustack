[project]
name = "gpustack"
version = "v0.0.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115.0,<0.137.0",
    "sqlmodel>=0.0.18",
    "pydantic>=2.11.5",
    "pydantic-settings>=2.2.1",
    "setproctitle>=1.3.3",
    "sqlalchemy[asyncio]>=2.0.38",
    "asyncpg>=0.29.0",
    "httpx[socks]>=0.27.0",
    "uvicorn>=0.32.0",
    "PyYAML>=6.0,<7.0",
    "tenacity>=9.0.0",
    "aiohttp>=3.11.2",
    "gpustack-runtime==0.2.3.post2",
    "attrs",
    "psutil",
    "cachetools",
    "importlib-resources",
    "aiocache>=0.12,<0.13",
    "anyio>=4,<5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "aiosqlite",
]

[project.scripts]
gpustack = "gpustack.main:main"

[build-system]
requires = ["hatchling<1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
only-include = ["gpustack"]
